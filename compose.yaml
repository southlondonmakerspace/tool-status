# Development stack: `docker compose up`
#
# Runs Django's dev server on http://localhost:8000 with your working copy
# mounted, so code and template changes reload without a rebuild.
# Production adds Caddy and gunicorn; see compose.prod.yaml.

services:
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - woodcode-data:/app/data

volumes:
  woodcode-data:
