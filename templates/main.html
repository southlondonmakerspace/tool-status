<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <script>
      // Follow the device's light/dark setting.
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() { document.documentElement.setAttribute("data-bs-theme", query.matches ? "dark" : "light"); }
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  </head>
  <body class="bg-body-tertiary">
    {% include "navbar.html" %}
    <main class="container py-4 py-md-5">
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="status">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
